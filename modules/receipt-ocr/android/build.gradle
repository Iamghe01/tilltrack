apply plugin: 'com.android.library'

group = 'expo.modules.receiptocr'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useDefaultAndroidSdkVersions()

android {
  namespace "expo.modules.receiptocr"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Bundled model: works offline straight after install, no Play Services download.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
  // Google's document scanner screen: finds the receipt edges, flattens it and removes shadows.
  implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'
}
